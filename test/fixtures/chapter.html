003e\u003cstrong\u003eDiscord: \u003ca href=\"https://dsc.gg/wetried\"\u003ehttps://dsc.gg/wetried\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u003cstrong\u003eA KNIGHT WHO ETERNALLY REGRESSES\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u003cstrong\u003eChapter 1: My Dream was to be a Knight\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e= = =\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eMy dream was to be a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe teacher who taught Enkrid how to use a sword was quite good-natured and never spoke ill of anyone.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eLeaning against the sword he held with its scabbard planted vertically on the ground, the teacher called Enkrid.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Go back to the village. If you hate farming, serve in the village militia. You might even become a Militia Captain.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHad he listened to those words from the teacher who had his fill of the sword, things might have been a little better.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut he didn't.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA single phrase that he heard when he was young was the problem.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Enki, you're a genius.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe had easily won a fight against a neighborhood brat a few years older than him with a wooden sword.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThat was when he was 11. It was the first time he was called a genius.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe didn't know back then that the bastard was incredibly bad at sword fighting.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAt fifteen, Enkrid fought an adult in the village with a wooden sword and won.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSince then, he became confident in his skills.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn the small village where he was born, there was no one who knew how to properly use a sword.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe best they had was a third-rate mercenary. He was a drifter who had lost one leg and washed up in the village.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe taught the village kids swordsmanship and Enkrid was among those kids.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You're a genius.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAt fifteen, he heard the same words for the second time.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIf the first time was from a village elder who knew nothing, then the second time it was from a mercenary who had given up his knighthood title and lost his leg for a lady.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;I must be a genius.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThat's what he thought.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe harbored a dream.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe decided to become a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA knight that would support a monarch who could unify the continent engulfed in war.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA knight who would put an end to the war.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt was around this time that a bard's song spread widely across the continent, reaching even Enkrid's small village.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe content was simple, but the melody was captivating, and the latter lyrics shook the heart.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe knight who will end this war!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe knight who will dye the war in twilight!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWe shall call him the Knight of Twilight!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe Knight of the End! The knight who will end the tumult!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe bard's song ignited the hearts of boys and girls.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;I will become that knight.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid felt the same.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAt eighteen, Enkrid left the village, thinking there was no one there who could match him.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe had no parents or siblings.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe had a few friends, but there were hardly any who could connect with Enkrid, a person obsessed with the sword since childhood.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn those gaps, the boy grew up and left.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThus, he began his life as a mercenary.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHis skills weren't bad. His attitude and hard work were commendable as well.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut two months were enough to realize that he wasn't a genius.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe was defeated by a so-called third-rate mercenary with no name.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You're not ripe yet.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe heard such words.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe thought having a good teacher would be enough.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe did his utmost and saved money. Risking half his life, he fought against bands of thieves.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWith the money he earned by doing that, he sought out a fencing school.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn big cities, there were usually one or two fencing schools.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe learned swordsmanship.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe wasn't unlucky as the teacher was honest and conscientious.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe told Enkrid to put down his sword.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;No. I won't.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid didn't give up.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You're really hardworking. Truly hardworking.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEveryone who saw Enkrid said so unanimously.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThey had to.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBecause hard work doesn't betray.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEven though his palms cracked open and his arm muscles trembled, he repeated it countless times.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe fared well in places where similar people gathered.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid was an outstanding hard worker. As he drifted from one fencing school to another, saving money, he had grown over twenty.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBy the time he was over twenty-five, he had built up some experience and skill, making a name for himself as a mercenary.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut at best, it was only after asking a few times in a small city that someone would say, \"Ah, that guy, he's pretty good with a sword.\"\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEven up to this point, there was a glimmer of hope.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHope that the future would be better than now.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut in the spring of his twenty-seventh year, Enkrid realized that his talent was insignificant.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe result of a casual quarrel made him privy to it. His sword flew out of his hand in five exchanges, and he had a hole in his stomach. Enkrid bit down, covering the hole in his stomach with his palm.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;How old are you?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Twelve.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eTwelve, he says. He was not even in his teens yet. This was a real genius.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Sorry, it was my first real fight.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe kid said so. He was not a noble, not a commoner, but a serf child.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe had been holding a sword for merely six months.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I went too hard with my hands. Take this for your medical expenses.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe kid's master, a character, tossed a purse of money.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt wasn't a fatal injury.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe intestines weren't damaged, and it wasn't stabbed too deeply.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eStill, he took the purse.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eFrom when he was eleven till now, Enkrid swung the sword for 16 years until his palms cracked. And yet, he lost to a twelve-year-old kid who had only trained for six months.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt would be a lie if he said he wasn't depressed. But he didn't live with a gloomy sentiment because of that.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere's no need to live so darkly and drearily, is there?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;It's not like my arms and legs were torn off.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid knew he wasn't a genius, but that didn't mean he gave up.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThus, he continued his life as a swordsman.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAround ten years of mercenary life.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEven if he couldn't become an outstanding knight or swordsman, he could be a seasoned soldier.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid quit being a mercenary and received military training. That was the best choice he could make.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe couldn't possibly start farming at this point.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA third-rate swordsman from a mercenary background, it was an appropriate description.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Do you think the military is a joke, accepting just anyone?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSomeone sneered.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Hang in there.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSomeone patted his shoulder.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe received recognition and also fell behind.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThus, at thirty.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn the Kingdom of Naurillia, the Cyprus Brigade.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e4th Regiment, 4th Battalion, 4th Company, 4th Squadron.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eKnown as the Fourth-Fourth Squad, that was where Enkrid was.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eRight below the Squad Leader, the position of a Decurion was Enkrid's.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eClang, clang, clang.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe night watchman struck the iron, waking up the entire barracks.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;\u0026hellip;What a horribly unsettling dream.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid muttered as he woke up to the sound.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;What kind of dream made you say that?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate next to him, who was getting up from his makeshift bed made of stacked blankets, asked as he shoved his feet into his boots.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThough his attitude was lax, this friend was more skilled than himself.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;My entire life.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;So omninous, ugh. Ah, a bug.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere was a bug in his boots, and the subordinate, who had half-put on his shoes, took them off and shook them out before putting them back on.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThen, he looked at the bug that had fallen to the floor, spat on it, and rubbed it with his foot.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe sticky mix of bodily fluids and saliva left a mark on the floor.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSeeing that, Enkrid also got up and gathered his gear.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA cuirass with a throwing knife stuck near the heart, arm guards, shin guards, etc.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eInside, he wore an under-armor made of thickly layered cloth.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eOver it, he wore armor made of leather.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe armor was made of several layers of leather, but it couldn't be considered very sturdy leather.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA well-sharpened blade could easily slice through it.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe arm guard reinforced with oiled wood was slightly better than others'.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I heard the previous Decurion had such a dream before he died.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid recalled hearing such rumors and muttered.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Am I destined to die today?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate laughed, so Enkrid flicked him on the back of his head.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I won't die. Don't jinx it.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe got up, poured water into a pot, and threw in a few pieces of meat jerky. Then, he added a few edible vegetables and boiled them.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBreakfast was ready.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Is there a skirmish planned for today?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate asked, and Enkrid shook his head.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I don't know.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe was just a lowly Decurion.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAbove the four Decurions, there was one Squad Leader.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eProbably even that Squad Leader wouldn't know.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid's swordsmanship was mediocre, and he wasn't a noble, so he stayed as a Decurion under the Squad Leader. However, his experience in the battlefield could chew up and spit out any average Company Commander.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eKnowing this, the Decurion's subordinates also respected Enkrid.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;So, what did you want to be when you were a kid, boss?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate approached and asked.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;A knight.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;\u0026hellip;Are you gonna hit me if I laugh?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I won't hit you.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Pfft.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You're laughing? You damn punk.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSaying so, he kicked the subordinate's buttocks.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate, pretending to be hurt, said,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I mean, a knight, really?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWhat is a knight?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSomeone who changes the tide of the battlefield.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA monster that stands alone against a thousand.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA hero who alone slays hundreds of enemies.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eMoreover, the unit they belonged to, the brigade they were a part of, was also named after a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe Cyprus Brigade, the army of Knight Cyprus.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eTo dream of being such a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Your dreams sure are ambitious.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Dreams are supposed to be ambitious, kid.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSaying so, Enkrid nonchalantly picked up a bowl.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eToday was his turn to do the dishes.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe wasn't sure about the other Decurions, but Enkrid's squad shared all the menial tasks equally.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBeing a Decurion was just about receiving and relaying orders.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eUsually, the person who was the best with a spear or sword did it.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn this regard, Enkrid was a bit special.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHis physical strength was weaker than other squad members.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut he was able to unite those who had been almost kicked out from other squads.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eOther units referred to Enkrid's squad as the \"Troublemaker Squad\" of the Fourth-Fourth.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid was the leader of such a squad.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I'll help.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Then shut up and follow.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Roger that.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate chuckled.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHow did this guy end up here?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe was a unique one, but Enkrid wasn't particularly curious about his subordinate's personal history.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSo he never asked.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe squad members liked this attitude of Enkrid's.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe didn't ask about the past and didn't nitpick about the present. Moreover, he didn't particularly demand anything.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003ePerhaps that's why all the squad members followed him.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAs he was clattering and washing the dishes, the subordinate, splashing water in the stream, asked,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Why did you want to become a knight?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe came to help but ended up just splashing around.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWould he laugh if he answered that he was captivated by the bard's song?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAfter thinking for a moment, Enkrid answered,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I wanted to be good with the sword, and I thought it would be nice to become a knight while I'm at it.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;That\u0026rsquo;s such a young man-like sentiment.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate snickered again.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Will you shut your mouth?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;So you danced with your sword morning and night for that?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;It\u0026rsquo;s because hard work doesn't betray.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eDue to swinging the sword countless times, his palms were full of calluses.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;So, even now?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eDo you want to become a knight?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHow could he? It's impossible, and he knows it better than anyone.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut he hadn't given up.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe just silently endured and moved forward.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid wasn't unaware of reality.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut the dream was silenced by reality, and the silenced Enkrid just became a soldier who lived with the sword.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;If you're done washing, let's go.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Let's go.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt was a trivial conversation.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe got up and returned to the barracks.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWhether there would be a skirmish with the kingdom where local battles were ongoing.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eOr maybe they would attack the recently emerged bandits targeting their supplies.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe didn't know what they would do.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;The air feels heavy.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe air on the battlefield is always like that.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut today, it felt even more so.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere was a lot of waiting time.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere was nothing much to do. He thought about swinging his sword, but he took a nap instead.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere are days when you don't want to do anything.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;It's as difficult as before.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe made relentless efforts.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThis is the result.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA Decurion at the level of a third-rate mercenary.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWhen the sun was well past its zenith, moving westward by about two arms' length, the Squad Leader shouted,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;All members of the Fourth-Fourth, assemble.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt was a skirmish.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe company members gathered, forming one flank of the army.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid's Decurion was no exception.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA cold tension enveloped his body.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid, holding the talisman necklace he acquired during his mercenary days, grasped it once before tucking it inside his clothes.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;Was this supposed to save my life?\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt's probably nonsense, but soldiers heading to the battlefield tend to easily believe in superstitions.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHowever, if you ask Enkrid himself if he believed in this talisman, the answer would probably be doubtful.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe just saw the old woman's eyes who gave it to him and was moved by her earnest words.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;There\u0026rsquo;s nothing to lose anyway.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAfter risking his life in a fight, all he got as a reward was this mere talisman.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt was due to luck that he had killed it. If things had gone wrong, he would have been the one to die.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eDespite it being a dangerous monster extermination, because it was a small slash-and-burn village, they had no money to give.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThey just happened to see Enkrid passing by and begged him to deal with the monster, clinging to the hem of his clothes.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;It's ridiculous.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eTo risk his life out of sympathy, it was madness.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut Enkrid didn't regret that decision.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBecause that's what a knight is.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEven if his dream was silenced and devoured by reality, leaving nothing but scars,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe wanted to be a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe wanted to be a war hero.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut now, he was just an ordinary soldier.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWaaaaaaaah!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA shout erupted.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid, too, raised the veins in his neck and roared.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eFrom the front, waves of armies rushed in.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe setting sun created a long twilight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBreaking through that twilight light, both armies charged.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid charged as well.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Fight while keeping your lives safe! Live!\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe ever-smiling subordinate shouted and dashed forward first.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSoon, spears and swords of both enemies and allies began tearing through each other's flesh and blood.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eToday's battle was a melee.\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e= = =\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eJoin our discord at \u003ca href=\"https://dsc.gg/wetried\"\u003ehttps://dsc.gg/wetried\u003c/a\u003e\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"montserrat_4dcea3f4-module__gzVhqW__variable open_sans_8b181427-module__T-aj7G__variable roboto_56fffbc8-module__6wySNq__variable baskervville_72e97f3d-module__KcNx9q__variable\",\"children\":[[\"$\",\"$L1d\",null,{\"API_Response\":{\"chapter\":{\"id\":1071,\"series_id\":32,\"season_id\":32,\"index\":\"1.0\",\"chapter_name\":\"Chapter 1\",\"chapter_title\":\"My Dream was to be a Knight\",\"chapter_data\":null,\"chapter_content\":\"$1e\",\"chapter_thumbnail\":null,\"chapter_slug\":\"chapter-1\",\"chapter_unique_id\":null,\"chapter_type\":\"Novel\",\"price\":0,\"created_at\":\"2024-02-10T19:24:45.652Z\",\"updated_at\":\"2024-09-01T15:01:03.683Z\",\"storage\":\"s3\",\"public\":true,\"release_date\":null,\"series\":{\"id\":32,\"series_slug\":\"a-knight-who-eternally-regresses\",\"title\":\"A Knight who Eternally Regresses\",\"thumbnail\":\"https://media.reaperscans.net/file/7BSHk1m/d5icxljssjbkq0z9makvlgfb.png\",\"meta\":{}},\"who_bought\":[],\"chapters_to_be_freed\":[],\"excerpt\":\"\u003cp style=\\\"margin-top: 9pt; margin-bottom: 0pt;\\\"\u003eThe teacher who taught Enkrid how to use a sword was quite good-natured and never spoke ill of anyone.\u003c/p\u003e\\r\\n\u003cp style=\\\"margin-top: 9pt; margin-bottom: 0pt;\\\"\u003e\u0026ldquo;You.\u0026rdquo;\u003c/p\u003e\\r\\n\u003cp style=\\\"margin-top: 9pt; margin-bottom: 0pt;\\\"\u003eLeaning against the sword he held with its scabbard planted vertically on the ground, the teacher called Enkrid.\u003c/p\u003e\",\"meta\":{\"continuation\":null}},\"previous_chapter\":{\"id\":1070,\"chapter_name\":\"Chapter 0\",\"chapter_title\":\"Prologue\",\"chapter_slug\":\"chapter-0\",\"chapters_to_be_freed\":[],\"excerpt\":null,\"meta\":{}},\"next_chapter\":{\"id\":1105,\"chapter_name\":\"Chapter 2\",\"chapter_title\":\"Zoetrope\",\"chapter_slug\":\"chapter-2\",\"chapters_to_be_freed\":[],\"excerpt\":null,\"meta\":{}}}}],\"$L1f\",\"$L20\",\"$L21\",\"$L22\",\"$L23\",\"$L24\"]}]\n"])</script><script>self.__next_f.push([1,"25:I[326086,[\"/_next/static/chunks/5aa53841c001020d.js\",\"/_next/static/chunks/a199d1eb70a0413b.js\",\"/_next/static/chunks/aabb920f1b5ac81d.js\",\"/_next/static/chunks/237cff534cc56f22.js\",\"/_next/static/chunks/3771ac99975127d2.js\",\"/_next/static/chunks/e17150cfffccdaf1.js\",\"/_next/static/chunks/c89e7853753d1807.js\",\"/_next/static/chunks/6c2439a7490fff37.js\",\"/_next/static/chunks/cf5269037ffbb1c6.js\",\"/_next/static/chunks/bf0e2c7633429635.js\",\"/_next/static/chunks/e8e4f398f797d07b.js\",\"/_next/static/chunks/5aaeeaa66dd9d294.js\",\"/_next/static/chunks/65dd70471c4755e5.js\",\"/_next/static/chunks/e9466e76b4be5e77.js\",\"/_next/static/chunks/48f680c4f3d4f73c.js\",\"/_next/static/chunks/1075054b39748a17.js\",\"/_next/static/chunks/174b6e1e5388d34f.js\",\"/_next/static/chunks/495cea50c0a99d63.js\",\"/_next/static/chunks/63fadbb94e140ff5.js\",\"/_next/static/chunks/aeaaaf02141ce669.js\",\"/_next/static/chunks/072fa8813ac0c0ca.js\"],\"default\"]\n27:I[679900,[\"/_next/static/chunks/5aa53841c001020d.js\",\"/_next/static/chunks/a199d1eb70a0413b.js\",\"/_next/static/chunks/aabb920f1b5ac81d.js\",\"/_next/static/chunks/237 /3771ac99975127d2.js\",\"/_next/static/chunks/e17150cfffccdaf1.js\",\"/_next/static/chunks/c89e7853753d1807.js\",\"/_next/static/chunks/6c2439a7490fff37.js\",\"/_next/static/chunks/cf5269037ffbb1c6.js\",\"/_next/static/chunks/bf0e2c7633429635.js\",\"/_next/static/chunks/e8e4f398f797d07b.js\",\"/_next/static/chunks/5aaeeaa66dd9d294.js\",\"/_next/static/chunks/65dd70471c4755e5.js\",\"/_next/static/chunks/e9466e76b4be5e77.js\",\"/_next/static/chunks/48f680c4f3d4f73c.js\",\"/_next/static/chunks/1075054b39748a17.js\",\"/_next/static/chunks/174b6e1e5388d34f.js\",\"/_next/static/chunks/495cea50c0a99d63.js\",\"/_next/static/chunks/63fadbb94e140ff5.js\",\"/_next/static/chunks/aeaaaf02141ce669.js\",\"/_next/static/chunks/072fa8813ac0c0ca.js\"],\"ChapterComments\"]\n2a:I[178215,[\"/_next/static/chunks/7a369ba543a72b9f.js\",\"/_next/static/chunks/226948e6ff9834d8.js\"],\"IconMark\"]\n1f:[\"$\",\"div\",null,{\"className\":\"container\",\"children\":[[\"$\",\"div\",null,{\"children\":false}],false]}]\n26:T6ee1,"])</script><script>self.__next_f.push([1,"\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u003cstrong\u003eWE TRIED TRANSLATIONS\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u003cstrong\u003eTranslator: Ryuu\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u003cstrong\u003eEditor: Abstract\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u003cstrong\u003eDiscord: \u003ca href=\"https://dsc.gg/wetried\"\u003ehttps://dsc.gg/wetried\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u003cstrong\u003eA KNIGHT WHO ETERNALLY REGRESSES\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u003cstrong\u003eChapter 1: My Dream was to be a Knight\u003c/strong\u003e\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e= = =\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eMy dream was to be a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe teacher who taught Enkrid how to use a sword was quite good-natured and never spoke ill of anyone.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eLeaning against the sword he held with its scabbard planted vertically on the ground, the teacher called Enkrid.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Go back to the village. If you hate farming, serve in the village militia. You might even become a Militia Captain.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHad he listened to those words from the teacher who had his fill of the sword, things might have been a little better.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut he didn't.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA single phrase that he heard when he was young was the problem.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Enki, you're a genius.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe had easily won a fight against a neighborhood brat a few years older than him with a wooden sword.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThat was when he was 11. It was the first time he was called a genius.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe didn't know back then that the bastard was incredibly bad at sword fighting.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAt fifteen, Enkrid fought an adult in the village with a wooden sword and won.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSince then, he became confident in his skills.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn the small village where he was born, there was no one who knew how to properly use a sword.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe best they had was a third-rate mercenary. He was a drifter who had lost one leg and washed up in the village.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe taught the village kids swordsmanship and Enkrid was among those kids.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You're a genius.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAt fifteen, he heard the same words for the second time.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIf the first time was from a village elder who knew nothing, then the second time it was from a mercenary who had given up his knighthood title and lost his leg for a lady.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;I must be a genius.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThat's what he thought.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe harbored a dream.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe decided to become a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA knight that would support a monarch who could unify the continent engulfed in war.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA knight who would put an end to the war.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt was around this time that a bard's song spread widely across the continent, reaching even Enkrid's small village.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe content was simple, but the melody was captivating, and the latter lyrics shook the heart.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe knight who will end this war!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe knight who will dye the war in twilight!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWe shall call him the Knight of Twilight!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe Knight of the End! The knight who will end the tumult!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe bard's song ignited the hearts of boys and girls.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;I will become that knight.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid felt the same.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAt eighteen, Enkrid left the village, thinking there was no one there who could match him.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe had no parents or siblings.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe had a few friends, but there were hardly any who could connect with Enkrid, a person obsessed with the sword since childhood.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn those gaps, the boy grew up and left.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThus, he began his life as a mercenary.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHis skills weren't bad. His attitude and hard work were commendable as well.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut two months were enough to realize that he wasn't a genius.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe was defeated by a so-called third-rate mercenary with no name.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You're not ripe yet.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe heard such words.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe thought having a good teacher would be enough.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe did his utmost and saved money. Risking half his life, he fought against bands of thieves.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWith the money he earned by doing that, he sought out a fencing school.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn big cities, there were usually one or two fencing schools.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe learned swordsmanship.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe wasn't unlucky as the teacher was honest and conscientious.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe told Enkrid to put down his sword.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;No. I won't.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid didn't give up.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You're really hardworking. Truly hardworking.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEveryone who saw Enkrid said so unanimously.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThey had to.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBecause hard work doesn't betray.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEven though his palms cracked open and his arm muscles trembled, he repeated it countless times.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe fared well in places where similar people gathered.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid was an outstanding hard worker. As he drifted from one fencing school to another, saving money, he had grown over twenty.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBy the time he was over twenty-five, he had built up some experience and skill, making a name for himself as a mercenary.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut at best, it was only after asking a few times in a small city that someone would say, \"Ah, that guy, he's pretty good with a sword.\"\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEven up to this point, there was a glimmer of hope.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHope that the future would be better than now.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut in the spring of his twenty-seventh year, Enkrid realized that his talent was insignificant.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe result of a casual quarrel made him privy to it. His sword flew out of his hand in five exchanges, and he had a hole in his stomach. Enkrid bit down, covering the hole in his stomach with his palm.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;How old are you?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Twelve.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eTwelve, he says. He was not even in his teens yet. This was a real genius.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Sorry, it was my first real fight.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe kid said so. He was not a noble, not a commoner, but a serf child.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe had been holding a sword for merely six months.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I went too hard with my hands. Take this for your medical expenses.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe kid's master, a character, tossed a purse of money.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt wasn't a fatal injury.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe intestines weren't damaged, and it wasn't stabbed too deeply.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eStill, he took the purse.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eFrom when he was eleven till now, Enkrid swung the sword for 16 years until his palms cracked. And yet, he lost to a twelve-year-old kid who had only trained for six months.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt would be a lie if he said he wasn't depressed. But he didn't live with a gloomy sentiment because of that.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere's no need to live so darkly and drearily, is there?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;It's not like my arms and legs were torn off.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid knew he wasn't a genius, but that didn't mean he gave up.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThus, he continued his life as a swordsman.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAround ten years of mercenary life.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEven if he couldn't become an outstanding knight or swordsman, he could be a seasoned soldier.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid quit being a mercenary and received military training. That was the best choice he could make.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe couldn't possibly start farming at this point.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA third-rate swordsman from a mercenary background, it was an appropriate description.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Do you think the military is a joke, accepting just anyone?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSomeone sneered.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Hang in there.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSomeone patted his shoulder.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe received recognition and also fell behind.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThus, at thirty.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn the Kingdom of Naurillia, the Cyprus Brigade.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e4th Regiment, 4th Battalion, 4th Company, 4th Squadron.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eKnown as the Fourth-Fourth Squad, that was where Enkrid was.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eRight below the Squad Leader, the position of a Decurion was Enkrid's.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eClang, clang, clang.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe night watchman struck the iron, waking up the entire barracks.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;\u0026hellip;What a horribly unsettling dream.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid muttered as he woke up to the sound.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;What kind of dream made you say that?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate next to him, who was getting up from his makeshift bed made of stacked blankets, asked as he shoved his feet into his boots.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThough his attitude was lax, this friend was more skilled than himself.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;My entire life.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;So omninous, ugh. Ah, a bug.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere was a bug in his boots, and the subordinate, who had half-put on his shoes, took them off and shook them out before putting them back on.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThen, he looked at the bug that had fallen to the floor, spat on it, and rubbed it with his foot.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe sticky mix of bodily fluids and saliva left a mark on the floor.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSeeing that, Enkrid also got up and gathered his gear.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA cuirass with a throwing knife stuck near the heart, arm guards, shin guards, etc.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eInside, he wore an under-armor made of thickly layered cloth.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eOver it, he wore armor made of leather.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe armor was made of several layers of leather, but it couldn't be considered very sturdy leather.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA well-sharpened blade could easily slice through it.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe arm guard reinforced with oiled wood was slightly better than others'.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I heard the previous Decurion had such a dream before he died.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid recalled hearing such rumors and muttered.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Am I destined to die today?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate laughed, so Enkrid flicked him on the back of his head.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I won't die. Don't jinx it.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe got up, poured water into a pot, and threw in a few pieces of meat jerky. Then, he added a few edible vegetables and boiled them.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBreakfast was ready.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Is there a skirmish planned for today?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate asked, and Enkrid shook his head.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I don't know.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe was just a lowly Decurion.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAbove the four Decurions, there was one Squad Leader.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eProbably even that Squad Leader wouldn't know.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid's swordsmanship was mediocre, and he wasn't a noble, so he stayed as a Decurion under the Squad Leader. However, his experience in the battlefield could chew up and spit out any average Company Commander.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eKnowing this, the Decurion's subordinates also respected Enkrid.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;So, what did you want to be when you were a kid, boss?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate approached and asked.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;A knight.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;\u0026hellip;Are you gonna hit me if I laugh?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I won't hit you.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Pfft.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;You're laughing? You damn punk.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSaying so, he kicked the subordinate's buttocks.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate, pretending to be hurt, said,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I mean, a knight, really?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWhat is a knight?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSomeone who changes the tide of the battlefield.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA monster that stands alone against a thousand.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA hero who alone slays hundreds of enemies.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eMoreover, the unit they belonged to, the brigade they were a part of, was also named after a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe Cyprus Brigade, the army of Knight Cyprus.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eTo dream of being such a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Your dreams sure are ambitious.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Dreams are supposed to be ambitious, kid.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSaying so, Enkrid nonchalantly picked up a bowl.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eToday was his turn to do the dishes.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe wasn't sure about the other Decurions, but Enkrid's squad shared all the menial tasks equally.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBeing a Decurion was just about receiving and relaying orders.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eUsually, the person who was the best with a spear or sword did it.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIn this regard, Enkrid was a bit special.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHis physical strength was weaker than other squad members.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut he was able to unite those who had been almost kicked out from other squads.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eOther units referred to Enkrid's squad as the \"Troublemaker Squad\" of the Fourth-Fourth.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid was the leader of such a squad.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I'll help.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Then shut up and follow.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Roger that.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate chuckled.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHow did this guy end up here?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe was a unique one, but Enkrid wasn't particularly curious about his subordinate's personal history.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSo he never asked.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe squad members liked this attitude of Enkrid's.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe didn't ask about the past and didn't nitpick about the present. Moreover, he didn't particularly demand anything.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003ePerhaps that's why all the squad members followed him.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAs he was clattering and washing the dishes, the subordinate, splashing water in the stream, asked,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Why did you want to become a knight?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe came to help but ended up just splashing around.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWould he laugh if he answered that he was captivated by the bard's song?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAfter thinking for a moment, Enkrid answered,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;I wanted to be good with the sword, and I thought it would be nice to become a knight while I'm at it.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;That\u0026rsquo;s such a young man-like sentiment.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe subordinate snickered again.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Will you shut your mouth?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;So you danced with your sword morning and night for that?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;It\u0026rsquo;s because hard work doesn't betray.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eDue to swinging the sword countless times, his palms were full of calluses.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;So, even now?\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eDo you want to become a knight?\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHow could he? It's impossible, and he knows it better than anyone.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut he hadn't given up.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe just silently endured and moved forward.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid wasn't unaware of reality.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut the dream was silenced by reality, and the silenced Enkrid just became a soldier who lived with the sword.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;If you're done washing, let's go.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Let's go.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt was a trivial conversation.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe got up and returned to the barracks.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWhether there would be a skirmish with the kingdom where local battles were ongoing.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eOr maybe they would attack the recently emerged bandits targeting their supplies.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe didn't know what they would do.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;The air feels heavy.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe air on the battlefield is always like that.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut today, it felt even more so.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere was a lot of waiting time.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere was nothing much to do. He thought about swinging his sword, but he took a nap instead.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThere are days when you don't want to do anything.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;It's as difficult as before.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe made relentless efforts.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThis is the result.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA Decurion at the level of a third-rate mercenary.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWhen the sun was well past its zenith, moving westward by about two arms' length, the Squad Leader shouted,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;All members of the Fourth-Fourth, assemble.\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt was a skirmish.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe company members gathered, forming one flank of the army.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid's Decurion was no exception.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA cold tension enveloped his body.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid, holding the talisman necklace he acquired during his mercenary days, grasped it once before tucking it inside his clothes.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;Was this supposed to save my life?\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt's probably nonsense, but soldiers heading to the battlefield tend to easily believe in superstitions.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHowever, if you ask Enkrid himself if he believed in this talisman, the answer would probably be doubtful.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe just saw the old woman's eyes who gave it to him and was moved by her earnest words.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;There\u0026rsquo;s nothing to lose anyway.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eAfter risking his life in a fight, all he got as a reward was this mere talisman.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eIt was due to luck that he had killed it. If things had gone wrong, he would have been the one to die.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eDespite it being a dangerous monster extermination, because it was a small slash-and-burn village, they had no money to give.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThey just happened to see Enkrid passing by and begged him to deal with the monster, clinging to the hem of his clothes.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026lsquo;It's ridiculous.\u0026rsquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eTo risk his life out of sympathy, it was madness.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut Enkrid didn't regret that decision.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBecause that's what a knight is.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEven if his dream was silenced and devoured by reality, leaving nothing but scars,\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe wanted to be a knight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eHe wanted to be a war hero.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBut now, he was just an ordinary soldier.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eWaaaaaaaah!\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eA shout erupted.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid, too, raised the veins in his neck and roared.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eFrom the front, waves of armies rushed in.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe setting sun created a long twilight.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eBreaking through that twilight light, both armies charged.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eEnkrid charged as well.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e\u0026ldquo;Fight while keeping your lives safe! Live!\u0026rdquo;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eThe ever-smiling subordinate shouted and dashed forward first.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eSoon, spears and swords of both enemies and allies began tearing through each other's flesh and blood.\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eToday's battle was a melee.\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003e= = =\u003c/p\u003e\r\n\u003cp style=\"margin-top: 9pt; margin-bottom: 0pt;\"\u003eJoin our discord at \u003ca href=\"https://dsc.gg/wetried\"\u003ehttps://dsc.gg/wetried\u003c/a\u003e\u003c/p\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L25\",null,{\"data\":\"$26\"}]\n21:[\"$\",\"div\",null,{\"className\":\"container\",\"children\":[\"$\",\"div\",null,{\"children\":false}]}]\n22:[\"$\",\"$L27\",null,{\"API_Response\":\"$8:props:children:0:props:API_Response\"}]\n23:[\"$\",\"$L28\",null,{\"API_Response\":\"$8:props:children:0:props:API_Response\"}]\n24:[\"$\",\"div\",null,{\"className\":\"container min-w-0 overflow-x-clip p-4 bg-background\",\"children\":[\"$\",\"$L29\",null,{\"chapter_slug\":\"chapter-1\",\"series_slug\":\"a-knight-who-eternally-regresses\"}]}]\nb:null\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"title\",\"0\",{\"children\":\"A Knight who Eternally Regresses - Chapter 1 - We Tried TLS\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Read A Knight who Eternally Regresses - Chapter 1 - We Tried TLS\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"A Knight who Eternally Regresses - We Tried TLS\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read A Knight who Eternally Regresses - Chapter 1 - We Tried TLS\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:site_name\",\"content\":\"We Tried TLS\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:image\",\"content\":\"https://media.reaperscans.net/file/7BSHk1m/d5icxljssjbkq0z9makvlgfb.png\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:image:width\",\"content\":\"120\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image:height\",\"content\":\"190\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image\",\"content\":\"https://media.reaperscans.net/file/7BSHk1m/d5icxljssjbkq0z9makvlgfb.png\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:type\",\"content\":
